<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة هند التعليمية — نموذج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#4E0007; --maroon-2:#6a1219; --pink:#F8AA9E; --pink-soft:#fcd3cb; --cream:#FEE6D3; --beige:#E4C9B0;
  --bg:#FFF8F3; --card:#ffffff; --ink:#2b0a0d; --muted:#7a5a5c; --line:#f1dccf;
  --ok:#2f7d5b; --warn:#b7791f; --bad:#b42318;
  --r:16px; --shadow:0 2px 10px rgba(78,0,7,.06), 0 10px 30px rgba(78,0,7,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--maroon)}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.35;color:var(--maroon)}
h1{font-size:clamp(28px,4.4vw,48px);font-weight:700}
h2{font-size:clamp(22px,3vw,32px);font-weight:700}
h3{font-size:18px;font-weight:600}
h4{font-size:15px;font-weight:600}
p{margin:0 0 .8em}
.muted{color:var(--muted)}
.small{font-size:13px}
.en{direction:ltr;unicode-bidi:isolate;font-family:"IBM Plex Sans Arabic",sans-serif}

/* demo bar */
#demobar{position:sticky;top:0;z-index:60;background:var(--maroon);color:#fff;display:flex;gap:10px;align-items:center;padding:8px 14px;flex-wrap:wrap;font-size:13px}
#demobar .lbl{opacity:.8;white-space:nowrap}
#demobar .roles{display:flex;gap:6px;flex-wrap:wrap;flex:1}
#demobar button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;white-space:nowrap}
#demobar button.on{background:var(--pink);color:var(--maroon);border-color:var(--pink);font-weight:600}
#demobar .scn{background:var(--cream);color:var(--maroon);font-weight:600;border:none}
@media(max-width:860px){#demobar{flex-wrap:nowrap;padding:6px 10px}#demobar .lbl{display:none}#demobar .roles{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#demobar .roles::-webkit-scrollbar{display:none}.pub-nav{top:41px;padding:10px 4vw;gap:10px}.pub-nav .btn-o{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:10px 18px;cursor:pointer;font-weight:600;transition:.15s;text-decoration:none}
.btn-p{background:var(--maroon);color:#fff}.btn-p:hover{background:var(--maroon-2)}
.btn-s{background:var(--pink);color:var(--maroon)}.btn-s:hover{filter:brightness(.97)}
.btn-o{background:transparent;border:1.5px solid var(--maroon);color:var(--maroon)}.btn-o:hover{background:var(--cream)}
.btn-g{background:var(--cream);color:var(--maroon)}
.btn-d{background:#fde8e6;color:var(--bad)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--cream);color:var(--maroon);white-space:nowrap}
.chip.ok{background:#e3f3ea;color:var(--ok)}.chip.warn{background:#fdf1dc;color:var(--warn)}.chip.bad{background:#fde8e6;color:var(--bad)}.chip.pink{background:var(--pink-soft)}
.chip.live{background:#fde8e6;color:var(--bad)}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* cards / layout */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;border:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.sep{height:1px;background:var(--line);margin:14px 0}

/* public site */
.pub-nav{display:flex;align-items:center;gap:20px;padding:14px 5vw;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:41px;z-index:40}
.pub-nav .links{display:flex;gap:18px;flex:1}
.pub-nav .links a{text-decoration:none;color:var(--ink);font-weight:500;cursor:pointer}
.pub-nav .links a:hover{color:var(--maroon)}
@media(max-width:860px){.pub-nav .links{display:none}}
.logo-h{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.logo-h img{height:44px}
.logo-h .wm{display:flex;flex-direction:column;line-height:1.05}
.logo-h .wm b{font-size:22px;color:var(--maroon)}
.logo-h .wm span{font-size:11px;letter-spacing:.3em;color:var(--maroon)}
.hero{position:relative;overflow:hidden;padding:70px 5vw 60px;background:linear-gradient(160deg,var(--cream),#fff 70%)}
.pattern{position:absolute;inset:0;background-image:url(icon.png);background-size:46px auto;opacity:.07;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;max-width:1200px;margin:0 auto}
@media(max-width:900px){.hero-in{grid-template-columns:1fr}}
.hero p.lead{font-size:18px;color:var(--muted);max-width:560px}
.free-banner{display:inline-flex;gap:8px;align-items:center;background:var(--maroon);color:#fff;border-radius:999px;padding:6px 16px 6px 6px;font-size:13px;margin-bottom:18px}
.free-banner b{background:var(--pink);color:var(--maroon);border-radius:999px;padding:2px 10px}
.hero-visual{position:relative}
.mock{background:#fff;border-radius:22px;box-shadow:0 30px 60px rgba(78,0,7,.15);padding:16px;border:1px solid var(--line)}
.section{padding:64px 5vw}
.section .in{max-width:1200px;margin:0 auto}
.section.alt{background:#fff}
.section.dark{background:var(--maroon);color:#fff}
.section.dark h2,.section.dark h3{color:#fff}
.feat .ic{width:46px;height:46px;border-radius:14px;background:var(--cream);display:grid;place-items:center;font-size:22px;margin-bottom:10px}
.steps{counter-reset:s}
.steps .card{position:relative;padding-top:34px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;right:20px;width:34px;height:34px;border-radius:50%;background:var(--maroon);color:#fff;display:grid;place-items:center;font-weight:700}
.plan{display:flex;flex-direction:column}
.plan.hl{border:2px solid var(--maroon);position:relative}
.plan .price{font-size:34px;font-weight:700;color:var(--maroon)}
.plan .price s{font-size:18px;color:var(--muted);font-weight:400;margin-inline-start:8px}
.plan ul{padding:0 18px 0 0;margin:10px 0 16px;flex:1}
.plan li{margin:4px 0}
.ribbon{position:absolute;top:-12px;left:20px;background:var(--pink);color:var(--maroon);font-weight:700;font-size:12px;padding:3px 12px;border-radius:999px}
.stat-big{font-size:38px;font-weight:700;color:var(--pink)}
footer{background:#2b0004;color:#e9cfc7;padding:40px 5vw;font-size:14px}
footer .in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px}
@media(max-width:800px){footer .in{grid-template-columns:1fr 1fr}}
footer h4{color:#fff}
footer a{color:#e9cfc7;display:block;text-decoration:none;cursor:pointer;margin:3px 0}

/* app shell */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 41px)}
.side{background:#fff;border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:41px;height:calc(100vh - 41px);overflow:auto}
.side .who{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--cream);margin:14px 0}
.side nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;color:var(--ink);text-decoration:none;cursor:pointer;font-weight:500;margin:2px 0}
.side nav a:hover{background:var(--bg)}
.side nav a.on{background:var(--maroon);color:#fff}
.side nav a .n{margin-inline-start:auto;background:var(--pink);color:var(--maroon);border-radius:999px;font-size:11px;padding:0 7px;font-weight:700}
.main{padding:26px 3vw 60px;min-width:0}
.main-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:20px}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;border-left:none;border-bottom:1px solid var(--line);padding:10px}
  .side .who,.side .logo-h,.side .side-foot{display:none}
  .side nav{display:flex;overflow-x:auto;gap:4px}
  .side nav a{white-space:nowrap}
}
.av{width:38px;height:38px;border-radius:50%;background:var(--pink);color:var(--maroon);display:grid;place-items:center;font-weight:700;flex:none}
.av.lg{width:56px;height:56px;font-size:20px}
.kpi .v{font-size:28px;font-weight:700;color:var(--maroon);line-height:1.2}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .d{font-size:12px;font-weight:600;color:var(--ok)}
.bar{height:8px;background:var(--cream);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--maroon);border-radius:99px}
.bar.pink>i{background:var(--pink)}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--maroon)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:right;font-weight:600;color:var(--muted);font-size:13px;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl{overflow-x:auto}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.tabs{display:flex;gap:4px;background:var(--cream);padding:4px;border-radius:12px;width:fit-content;flex-wrap:wrap}
.tabs button{border:none;background:transparent;padding:6px 14px;border-radius:9px;cursor:pointer;font-weight:500}
.tabs button.on{background:#fff;color:var(--maroon);box-shadow:var(--shadow)}
.notice{border-radius:14px;padding:12px 16px;background:var(--cream);border:1px dashed var(--beige);display:flex;gap:10px;align-items:flex-start}
.notice.dark{background:var(--maroon);color:#fff;border:none}
.chartbars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.chartbars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chartbars .b i{display:block;width:100%;max-width:38px;background:var(--maroon);border-radius:8px 8px 3px 3px}
.chartbars .b i.t{background:var(--pink)}
.chartbars .b span{font-size:11px;color:var(--muted)}

/* forms */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:500;margin-bottom:5px;font-size:14px}
.inp{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;outline:none}
.inp:focus{border-color:var(--pink)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;margin-bottom:10px;background:#fff}
.opt.on{border-color:var(--maroon);background:var(--cream)}
.opt input{margin-top:6px;accent-color:var(--maroon)}
.switch{position:relative;width:46px;height:26px;flex:none;cursor:pointer}
.switch input{display:none}
.switch i{position:absolute;inset:0;background:#e6d3c7;border-radius:99px;transition:.2s}
.switch i::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--maroon)}
.switch input:checked+i::after{right:23px}
.wizard-steps{display:flex;gap:6px;margin-bottom:22px}
.wizard-steps div{flex:1;height:6px;border-radius:9px;background:var(--line)}
.wizard-steps div.on{background:var(--maroon)}

/* quiz */
.q-opt{display:block;width:100%;text-align:right;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;cursor:pointer}
.q-opt:hover{border-color:var(--pink)}
.q-opt.right{border-color:var(--ok);background:#e3f3ea}
.q-opt.wrong{border-color:var(--bad);background:#fde8e6}

/* overlays */
#modal{position:fixed;inset:0;background:rgba(43,0,4,.45);display:none;z-index:200;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .box{background:#fff;border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px;position:relative}
#modal .x{position:absolute;left:14px;top:12px;border:none;background:var(--cream);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
#overlay{position:fixed;inset:0;z-index:150;background:#1d0204;display:none;color:#fff}
#overlay.on{display:block}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--maroon);color:#fff;padding:12px 20px;border-radius:14px;z-index:300;transition:.3s;box-shadow:var(--shadow);max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}

/* live room */
.room{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
.room-top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#2b0004;flex-wrap:wrap}
.room-body{display:grid;grid-template-columns:1fr 320px;min-height:0}
@media(max-width:860px){.room-body{grid-template-columns:1fr}.room-side{display:none}}
.stage{padding:14px;display:grid;grid-template-rows:1fr auto;gap:12px;min-height:0;position:relative}
.board{background:#fffdf9;color:var(--ink);border-radius:18px;padding:26px;overflow:auto;position:relative}
.board h2{color:var(--maroon)}
.wm-overlay{position:absolute;inset:0;pointer-events:none;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around;opacity:.06;font-size:14px;transform:rotate(-18deg);color:var(--maroon);overflow:hidden}
.tiles{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.tile{flex:none;width:120px;height:86px;border-radius:14px;background:#3a0a0e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;font-size:12px;border:2px solid transparent}
.tile.speak{border-color:var(--pink)}
.tile .hand{position:absolute;top:4px;left:6px;font-size:16px}
.tile .mic{position:absolute;bottom:4px;right:6px;font-size:11px;opacity:.7}
.tile.teacher{background:var(--pink);color:var(--maroon);width:150px}
.room-side{background:#2b0004;display:flex;flex-direction:column;min-height:0;border-right:1px solid #4a1015}
.room-side .tabs{background:#3a0a0e;margin:10px}
.room-side .tabs button{color:#f5d7cf}
.room-side .tabs button.on{background:var(--pink);color:var(--maroon)}
.chat{flex:1;overflow:auto;padding:0 14px}
.msg{background:#3a0a0e;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}
.msg b{color:var(--pink);font-size:12px;display:block}
.msg.t{background:#5a1b20}
.room-ctrl{display:flex;justify-content:center;gap:10px;padding:12px;background:#2b0004;flex-wrap:wrap}
.cbtn{background:#3a0a0e;border:none;color:#fff;border-radius:14px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-width:74px}
.cbtn .i{font-size:18px}
.cbtn.on{background:var(--pink);color:var(--maroon)}
.cbtn.end{background:var(--bad)}
.priv-pill{background:#3a0a0e;border-radius:999px;padding:4px 12px;font-size:12px;color:#f5d7cf}

/* lesson player */
.player{aspect-ratio:16/9;border-radius:18px;background:linear-gradient(135deg,var(--maroon),#7d1a22);position:relative;overflow:hidden;display:grid;place-items:center;color:#fff}
.player .pattern{opacity:.08}
.player .play{width:76px;height:76px;border-radius:50%;background:var(--pink);color:var(--maroon);border:none;font-size:28px;cursor:pointer;position:relative}
.player .prog{position:absolute;bottom:0;right:0;left:0;height:6px;background:rgba(255,255,255,.2)}
.player .prog i{display:block;height:100%;background:var(--pink);width:0}
.player .cap{position:absolute;bottom:22px;right:0;left:0;text-align:center}
.player .cap span{background:rgba(0,0,0,.55);padding:4px 12px;border-radius:8px;font-size:15px}
.vocab{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.vocab button{border:none;background:var(--cream);width:34px;height:34px;border-radius:50%;cursor:pointer}

/* certificate */
.cert{background:#fff;border:1px solid var(--line);border-radius:12px;padding:30px;position:relative;overflow:hidden;direction:ltr;text-align:left}
.cert .side-pat{position:absolute;top:0;bottom:0;right:0;width:22%;background-image:url(icon.png);background-size:40px auto;opacity:.35}
.cert h3{letter-spacing:.06em;font-size:16px}

/* scenario guide */
#guide{position:fixed;bottom:18px;left:18px;width:330px;max-width:calc(100vw - 36px);background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(78,0,7,.25);z-index:120;display:none;border:2px solid var(--pink)}
#guide.on{display:block}
#guide .hd{background:var(--maroon);color:#fff;padding:10px 14px;border-radius:15px 15px 0 0;display:flex;justify-content:space-between;align-items:center}
#guide ol{margin:0;padding:12px 30px 12px 14px;max-height:45vh;overflow:auto}
#guide li{margin:6px 0;font-size:14px;cursor:pointer}
@media(max-width:640px){#guide{left:8px;bottom:8px;width:calc(100vw - 16px)}#guide ol{max-height:20vh}}
#guide li.done{color:var(--muted);text-decoration:line-through}
#guide .hd button{background:none;border:none;color:#fff;cursor:pointer;font-size:16px}
.scn-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:right}
.yes{color:var(--ok);font-weight:700}.no{color:#c9b3aa}.part{color:var(--warn);font-weight:700}
.post{padding:14px 0;border-bottom:1px solid var(--line)}
.acc{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.acc summary{padding:12px 14px;cursor:pointer;font-weight:600}
.acc div{padding:0 14px 12px}
</style>
</head>
<body>
<div id="demobar"></div>
<div id="app"></div>
<div id="overlay"></div>
<div id="modal"><div class="box"><button class="x" onclick="closeModal()">✕</button><div id="mbody"></div></div></div>
<div id="toast"></div>
<div id="guide"></div>

<script>
/* ============ DATA ============ */
const S = {
  role: 'public',
  view: 'home',
  freePhase: true,
  freeUntil: '30 يونيو 2027',
  user: {name:'سارة أحمد المحمدي', display:'سارة', level:'A1', plan:'premium', code:'HIND100', age:'18-25', gov:'تعز', guardian:false, onlyNick:true, camOff:true, profileVis:'class'},
  signup: {step:1, data:{}},
  placement: null,
  plans: [
    {id:'free', name:'الأساسية', price:0, desc:'كل ما تحتاجه الطالبة لتبدأ', feats:['الدروس المباشرة الجماعية (حتى 12 طالبة)','مسار تعليمي كامل حسب المستوى','تمارين تفاعلية وواجبات','مجتمع الدارسات المُشرف عليه','وضع الصوت فقط لتوفير البيانات']},
    {id:'premium', name:'المميزة', price:4, desc:'متابعة أقرب وتطوير أسرع', feats:['كل مزايا الخطة الأساسية','حلقات محادثة صغيرة (4 طالبات)','عيادة النطق الأسبوعية مع معلمة','تنزيل الدروس للمشاهدة دون إنترنت','شهادة إتمام معتمدة لكل مستوى','متابعة فردية شهرية']},
    {id:'career', name:'المهنية', price:9, desc:'للعمل والدراسة الجامعية', feats:['كل مزايا الخطة المميزة','مسار إنجليزية العمل والمقابلات','تحضير لاختبارات IELTS / TOEFL','مراجعة السيرة الذاتية بالإنجليزية','جلسة إرشاد مهني شهرية']}

/* ============ HELPERS ============ */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
function modal(h){$('#mbody').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function setRole(r,v){S.role=r;S.view=v||(r==='public'?'home':'dash');closeOverlay();render();window.scrollTo(0,0)}
function go(v){S.view=v;render();window.scrollTo(0,0)}
function speak(w){try{const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){toast('النطق غير متاح في هذا المتصفح')}}
function copyText(t){try{navigator.clipboard.writeText(t).then(()=>toast('تم النسخ ✓'),()=>toast('انسخي يدوياً: '+t))}catch(e){toast('انسخي يدوياً: '+t)}}
const logoH = (w=false)=>`<a class="logo-h" onclick="setRole('public','home')"><img src="${w?'icon-w.png':'icon.png'}" alt=""><div class="wm"><b>هنـد</b><span>HIND</span></div></a>`;
const kpi=(v,l,d)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:''}</div>`;
const bar=(p,c='')=>`<div class="bar ${c}"><i style="width:${p}%"></i></div>`;
const ring=(p,l='')=>`<div class="ring" style="background:conic-gradient(var(--maroon) ${p*3.6}deg,var(--cream) 0)"><div>${p}%</div></div>`;
const sw=(on,fn)=>`<label class="switch"><input type="checkbox" ${on?'checked':''} onchange="${fn}"><i></i></label>`;
function planPrice(p,code){const c=S.codes.find(x=>x.code===code&&x.active);if(!c)return p.price;return +(p.price*(1-c.pct/100)).toFixed(2)}

}

function matrix(){
  const cols=['طالبة','معلمة','ولي أمر','مشرفة','إدارة','شريك'];
  const rows=[['حضور الدروس المباشرة','y','y','n','p','p','n'],['إدارة الفصل وجدولة الدروس','n','y','n','p','y','n'],['رؤية الدردشة والتسجيلات','y','y','n','p','n','n'],['متابعة تقدم طالبة محددة','y','y','p','y','y','n'],['تصحيح الواجبات','n','y','n','n','n','n'],['اعتماد المحتوى','n','n','n','y','y','n'],['معالجة البلاغات','n','n','n','y','y','n'],['إدارة الخطط وأكواد الخصم','n','n','n','n','y','n'],['مؤشرات الأثر المجمّعة (بدون أسماء)','n','n','n','y','y','y']];
  const m={y:'<span class="yes">✓</span>',n:'<span class="no">—</span>',p:'<span class="part">◐</span>'};
  return `<table class="matrix"><tr><th>الصلاحية</th>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(x=>`<td>${m[x]}</td>`).join('')}</tr>`).join('')}</table><p class="small muted" style="margin:10px 0 0">◐ = صلاحية جزئية: ولي الأمر بإذن الطالبة فقط · المشرفة تدخل الدرس بشكل مُعلن · الإدارة والشريك يرون بيانات مجمعة.</p>`;
}

function startSignup(plan){S.signup={step:1,data:{plan:plan||'premium',code:'',age:'18-25',verify:'call'}};S.placement=null;S.role='public';go('signup')}
function sv(k,v){S.signup.data[k]=v}

  <label class="f"><span>رقم الجوال أو البريد</span><input class="inp" dir="ltr" placeholder="+967 7xx xxx xxx" oninput="sv('phone',this.value)"></label>

  <label class="f"><span>الفئة العمرية</span><select class="inp" onchange="sv('age',this.value);render()">${['أقل من 18','18-25','26-40','أكبر من 40'].map(a=>`<option ${d.age===a?'selected':''}>${a}</option>`).join('')}</select></label>
  <label class="f"><span>هدفك من التعلم</span><select class="inp">${['الدراسة الجامعية','العمل','مساعدة أطفالي','التواصل والسفر','تطوير ذاتي'].map(a=>`<option>${a}</option>`).join('')}</select></label></div>
  ${d.age==='أقل من 18'?`<div class="notice">👪 <div class="small"><b>لأنك أقل من 18 سنة</b> نحتاج موافقة ولي الأمر. سنرسل له رسالة برابط موافقة، ويمكنه بعدها متابعة تقدمك وحضورك فقط.<label class="f" style="margin:8px 0 0"><input class="inp" dir="ltr" placeholder="رقم جوال ولي الأمر"></label></div></div>`:''}

  ${[['call','📞 مكالمة صوتية قصيرة مع موظفة التحقق','دقيقتان، في الوقت الذي تختارينه. لا فيديو.'],['id','🪪 صورة الهوية تراجعها موظفة','تُحذف الصورة نهائياً فور انتهاء التحقق.'],['invite','💌 دعوة من جهة شريكة أو معلمة','إذا وصلك كود دعوة من جمعية أو مدرسة شريكة.']].map(o=>`<label class="opt ${d.verify===o[0]?'on':''}"><input type="radio" name="v" ${d.verify===o[0]?'checked':''} onchange="sv('verify','${o[0]}');render()"><div><b>${o[1]}</b><div class="small muted">${o[2]}</div></div></label>`).join('')}

const PQ=[
 {q:'Choose the correct greeting for the morning:',o:['Good night','Good morning','Goodbye'],a:1},
 {q:'"I ___ a teacher."',o:['am','is','are'],a:0},
 {q:'What is the plural of "child"?',o:['childs','children','childes'],a:1},
 {q:'"She ___ to the market every Friday."',o:['go','goes','going'],a:1},

function placementView(inWizard){
  if(!S.placement)S.placement={i:0,score:0,ans:null};
  const P=S.placement;
  if(P.i>=PQ.length){
    const lv=P.score<=1?'A0':P.score<=3?'A1':P.score<=4?'A2':'B1';P.level=lv;
    const names={A0:'المستوى التمهيدي',A1:'المستوى الأول',A2:'المستوى الثاني',B1:'المستوى المتوسط'};
    return `<div style="text-align:center"><div style="font-size:48px">🎉</div><h2>مستواك: ${names[lv]} <span class="en">(${lv})</span></h2><p class="muted">أجبتِ على ${P.score} من ${PQ.length} بشكل صحيح. سنضعك في فصل مناسب، ويمكنك إعادة الاختبار بعد شهر.</p>
    ${inWizard?`<div class="row" style="justify-content:center"><button class="btn btn-g" onclick="S.signup.step=2;render()">→ السابق</button><button class="btn btn-p" onclick="S.signup.step=4;render()">التالي: اختيار الخطة ←</button></div>`:`<button class="btn btn-p" onclick="startSignup()">سجّلي الآن مجاناً</button>`}</div>`;
  }
  const q=PQ[P.i];
  return `<div class="row between"><h3 style="margin:0">اختبار تحديد المستوى</h3><span class="chip">${P.i+1} / ${PQ.length}</span></div>${bar((P.i/PQ.length)*100,'pink')}
  <p class="en" style="font-size:19px;font-weight:600;margin:22px 0 6px;text-align:left">${q.q}</p>
  <div dir="ltr">${q.o.map((o,j)=>`<button class="q-opt en ${P.ans!==null?(j===q.a?'right':j===P.ans?'wrong':''):''}" style="text-align:left" ${P.ans!==null?'disabled':''} onclick="pAns(${j})">${o}</button>`).join('')}</div>
  <div class="row between" style="margin-top:12px">${inWizard?`<button class="btn btn-g btn-sm" onclick="S.placement.i=99;S.placement.score=0;render()">تخطي (ابدئي من التمهيدي)</button>`:'<span></span>'}${P.ans!==null?`<button class="btn btn-p" onclick="S.placement.i++;S.placement.ans=null;render()">التالي ←</button>`:''}</div>`;
}
function pAns(j){const P=S.placement;P.ans=j;if(j===PQ[P.i].a)P.score++;render()}

/* ============ QUIZ ENGINE ============ */
const QZ={greet:[
 {q:'How do you answer "How are you?"',o:['I am fine, thank you.','My name is Sara.','I am from Taiz.'],a:0},
 {q:'"Nice to ___ you."',o:['see','meet','make'],a:1},
 {q:'Which one is a question?',o:['I am Noor.','Where are you from?','She is a teacher.'],a:1},
 {q:'Choose the correct word: "___ name is Amal."',o:['My','I','Me'],a:0}
]};
let QS={};
function quizView(id,key){
  const Q=QZ[key];QS[id]=QS[id]||{i:0,s:0,a:null};const st=QS[id];
  if(st.i>=Q.length)return `<div style="text-align:center;padding:10px"><div style="font-size:40px">🌟</div><h3>أحسنتِ! ${st.s} / ${Q.length}</h3><p class="muted small">تمت إضافة النتيجة إلى تقدمك.</p><button class="btn btn-g btn-sm" onclick="QS['${id}']=null;render()">إعادة المحاولة</button></div>`;
  const q=Q[st.i];
  return `<div class="row between"><b>سؤال ${st.i+1} من ${Q.length}</b><span class="chip">${st.s} صحيحة</span></div><p class="en" style="font-size:17px;font-weight:600;text-align:left;margin:12px 0 4px">${q.q}</p><div dir="ltr">${q.o.map((o,j)=>`<button class="q-opt en ${st.a!==null?(j===q.a?'right':j===st.a?'wrong':''):''}" style="text-align:left" ${st.a!==null?'disabled':''} onclick="qAns('${id}','${key}',${j})">${o}</button>`).join('')}</div>${st.a!==null?`<div class="row between"><span class="small">${st.a===q.a?'✅ إجابة صحيحة!':'💡 الإجابة الصحيحة مظللة بالأخضر'}</span><button class="btn btn-p btn-sm" onclick="QS['${id}'].i++;QS['${id}'].a=null;rerenderQuiz('${id}','${key}')">التالي ←</button></div>`:''}`;
}
function qAns(id,key,j){const st=QS[id];st.a=j;if(j===QZ[key][st.i].a)st.s++;rerenderQuiz(id,key)}
function rerenderQuiz(id,key){const el=document.getElementById('qz-'+id);if(el)el.innerHTML=quizView(id,key);else render()}

 <div class="grid g2" style="margin-top:16px"><div class="card"><h3>أحدث البلاغات</h3>${S.reports.filter(r=>r.status==='open').slice(0,3).map(r=>`<div class="list-item"><span class="chip ${r.sev==='عالية'?'bad':r.sev==='متوسطة'?'warn':''}">${r.sev}</span><span style="flex:1" class="small">${r.what}</span></div>`).join('')}<button class="btn btn-o btn-sm" style="margin-top:8px" onclick="go('reports')">كل البلاغات</button></div>
 <div class="card"><h3>ميثاق الإشراف</h3><ul class="small muted" style="padding-right:18px;margin:0"><li>المشرفات نساء موثّقات فقط.</li><li>الدخول للدروس يكون مُعلناً دائماً ويظهر للمشاركات.</li><li>لا يُطّلع على الدردشة إلا عند وجود بلاغ.</li><li>كل إجراء يُسجّل في سجل التدقيق.</li></ul></div></div>`},
monitor(){return `<div class="main-head"><h2>الدروس الجارية الآن</h2></div><div class="grid g3">${[[S.sessions[0],'أ. أسماء القدسي',9],[{id:7,title:'Phone Calls — A2',level:'A2'},'أ. فاطمة الأهدل',11],[{id:8,title:'Presentations — B1',level:'B1'},'أ. منى الحكيمي',7]].map(([s,t,n])=>`<div class="card"><span class="chip live">مباشر</span><h4 class="en" style="margin-top:10px">${s.title}</h4><div class="small muted">${t} · ${n} طالبات</div><div class="row" style="margin-top:10px"><span class="small">صحة الاتصال</span>${bar(85)}</div><button class="btn btn-o btn-sm" style="margin-top:12px" onclick="openRoom('observer',1)">👁️ دخول مُعلن للمراقبة</button></div>`).join('')}</div>`},
reports(){return `<div class="main-head"><div><h2>البلاغات</h2><p class="muted" style="margin:0">تُعالج البلاغات عالية الخطورة خلال ساعة.</p></div></div><div class="card tbl"><table><tr><th>البلاغ</th><th>المكان</th><th>المُبلِغة</th><th>الخطورة</th><th>الحالة</th><th></th></tr>${S.reports.map((r,i)=>`<tr><td>${r.what}</td><td class="small">${r.where}</td><td class="small muted">${r.by}</td><td><span class="chip ${r.sev==='عالية'?'bad':r.sev==='متوسطة'?'warn':''}">${r.sev}</span></td><td>${r.status==='open'?'<span class="chip warn">مفتوح</span>':`<span class="chip ok">${r.action||'مغلق'}</span>`}</td><td>${r.status==='open'?`<button class="btn btn-p btn-sm" onclick="handleReport(${i})">معالجة</button>`:''}</td></tr>`).join('')}</table></div>`},
review(){return `<div class="main-head"><h2>مراجعة المحتوى</h2></div>${S.materials.map((m,i)=>`<div class="card" style="margin-bottom:12px"><div class="row between"><div><b class="en">${esc(m.title)}</b><div class="small muted">${m.type} · ${m.by}</div></div>${m.status==='review'?`<div class="row"><button class="btn btn-p btn-sm" onclick="S.materials[${i}].status='approved';toast('✓ اعتُمدت ونُشرت للطالبات');render()">اعتماد ونشر</button><button class="btn btn-d btn-sm" onclick="S.materials[${i}].status='rejected';toast('أُعيدت للمعلمة مع ملاحظات');render()">طلب تعديل</button></div>`:m.status==='approved'?'<span class="chip ok">منشورة</span>':'<span class="chip bad">تحتاج تعديل</span>'}</div>${m.status==='review'?`<div class="notice small" style="margin-top:10px">✓ معايير المراجعة: دقة لغوية · مناسبة ثقافياً · صور لائقة · ملكية فكرية · مستوى مناسب</div>`:''}</div>`).join('')}`},
quality(){return `<div class="main-head"><h2>جودة التعليم</h2></div><div class="card tbl"><table><tr><th>المعلمة</th><th>تقييم الطالبات</th><th>الحضور</th><th>زيارات المراقبة</th><th>آخر ملاحظة</th></tr>${[['أ. أسماء القدسي',4.9,91,3,'تفاعل ممتاز'],['أ. منى الحكيمي',4.7,86,2,'تأخر مرة واحدة'],['أ. رنا العبسي',4.8,94,2,'عيادة النطق متميزة'],['أ. فاطمة الأهدل',4.6,88,1,'تحتاج غرف جانبية أكثر']].map(t=>`<tr><td><b>${t[0]}</b></td><td>⭐ ${t[1]}</td><td style="width:150px">${bar(t[2])}<span class="small muted">${t[2]}%</span></td><td>${t[3]}</td><td class="small muted">${t[4]}</td></tr>`).join('')}</table></div>`}
};
function handleReport(i){const r=S.reports[i];modal(`<h3>معالجة البلاغ</h3><p>${r.what}</p><p class="small muted">${r.where} · ${r.by}</p>${['تعليق الحساب مؤقتاً وإعادة التحقق','إنذار رسمي','حذف المحتوى','تواصل مع المعلمة','إغلاق — لا يوجد مخالفة'].map((a,j)=>`<label class="opt"><input type="radio" name="ha" value="${a}" ${j===0?'checked':''}><span>${a}</span></label>`).join('')}<label class="f"><span>ملاحظة للسجل</span><textarea class="inp" rows="2"></textarea></label><button class="btn btn-p" onclick="S.reports[${i}].status='closed';S.reports[${i}].action=document.querySelector('input[name=ha]:checked').value;closeModal();toast('✓ تم تنفيذ الإجراء وإشعار المُبلِغة');render()">تنفيذ</button>`)}

 <div class="card tbl"><table id="ut"><tr><th>الاسم الظاهر</th><th>الدور</th><th>المستوى</th><th>المحافظة</th><th>الحالة</th><th>الكود</th><th></th></tr>${S.users.map((u,i)=>`<tr data-n="${esc(u[0])}"><td><b>${esc(u[0])}</b></td><td>${u[1]}</td><td>${u[2]}</td><td>${u[3]}</td><td><span class="chip ${u[4]==='نشطة'?'ok':u[4].includes('موقوفة')?'bad':'warn'}">${u[4]}</span></td><td class="en small">${u[5]}</td><td>${u[4].includes('بانتظار')?`<button class="btn btn-p btn-sm" onclick="S.users[${i}][4]='نشطة';toast('✓ تم التحقق والتفعيل');render()">تحقق</button>`:`<button class="btn btn-g btn-sm" onclick="toast('سجل النشاط')">السجل</button>`}</td></tr>`).join('')}</table></div>`},
apps(){return `<div class="main-head"><div><h2>طلبات المعلمات</h2><p class="muted" style="margin:0">الطلب ← اختبار اللغة ← مقابلة ← أكاديمية المعلمات ← درس تجريبي ← اعتماد</p></div><button class="btn btn-o btn-sm" onclick="setRole('public','teach')">صفحة التقديم العامة</button></div>

codes(){return `<div class="main-head"><div><h2>أكواد الخصم</h2><p class="muted" style="margin:0">أداة مرحلة الإطلاق: كود مجاني مباشر، وأكواد للشركاء والمنح.</p></div><button class="btn btn-p" onclick="newCode()">+ إنشاء كود</button></div>
 <div class="card tbl"><table><tr><th>الكود</th><th>الخصم</th><th>الاستخدام</th><th>صالح حتى</th><th>الوصف</th><th>فعّال</th><th></th></tr>${S.codes.map((c,i)=>`<tr><td><b class="en" style="color:var(--maroon)">${c.code}</b></td><td>${c.pct}%</td><td style="width:150px">${bar(c.used/c.limit*100,'pink')}<span class="small muted">${c.used} / ${c.limit}</span></td><td>${c.until}</td><td class="small">${c.note}</td><td>${sw(c.active,`S.codes[${i}].active=this.checked;toast(this.checked?'تم التفعيل':'تم الإيقاف')`)}</td><td><button class="btn btn-g btn-sm" onclick="copyText('${c.code}')">نسخ</button></td></tr>`).join('')}</table></div>

plans(){return `<div class="main-head"><h2>الخطط ومرحلة المجانية</h2></div>
 <div class="card" style="margin-bottom:16px;${S.freePhase?'border:2px solid var(--maroon)':''}"><div class="row between"><div><h3 style="margin:0">🎁 مرحلة الإطلاق المجانية</h3><p class="small muted" style="margin:4px 0 0">عند التفعيل: تظهر كل الخطط بسعر 0$ في الموقع العام، ويُقترح الكود HIND100 تلقائياً.</p></div>${sw(S.freePhase,"S.freePhase=this.checked;toast(this.checked?'مرحلة المجانية مفعّلة':'تم إيقاف مرحلة المجانية — شاهدي الموقع العام');render()")}</div>
 <div class="grid g2" style="margin-top:12px"><label class="f"><span>تنتهي في</span><input class="inp" value="${S.freeUntil}" onchange="S.freeUntil=this.value"></label><label class="f"><span>إشعار الطالبات قبل الانتهاء</span><select class="inp"><option>30 يوماً</option><option>14 يوماً</option></select></label></div>
 <button class="btn btn-o btn-sm" onclick="setRole('public','home');setTimeout(()=>goHome('pricing'),50)">معاينة صفحة الأسعار ←</button></div>
 <div class="grid g3">${S.plans.map((p,i)=>`<div class="card"><h3>${p.name}</h3><label class="f"><span>السعر الشهري ($)</span><input class="inp" type="number" value="${p.price}" onchange="S.plans[${i}].price=+this.value;toast('تم تحديث السعر')"></label><ul class="small" style="padding-right:18px">${p.feats.map(f=>`<li>${f}</li>`).join('')}</ul></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h3>نموذج الاستدامة المقترح (بعد الإطلاق)</h3><div class="grid g4">${[['الأساسية','مجانية دائماً — لضمان الوصول'],['المميزة / المهنية','رسوم رمزية للقادرات'],['المقاعد المرعية','شركاء يرعون منحاً كاملة'],['الخدمات المؤسسية','تدريب موظفات المنظمات والشركات']].map(x=>`<div class="notice" style="display:block"><b>${x[0]}</b><div class="small muted">${x[1]}</div></div>`).join('')}</div></div>`},
impact(){return `<div class="main-head"><div><h2>تقارير الأثر</h2><p class="muted" style="margin:0">قياس دوري وفق خطة المبادرة: اختبارات قبلية/بعدية، رضا، دراسات حالة.</p></div><button class="btn btn-o btn-sm" onclick="copyText('تقرير هند — نوفمبر 2026: 312 طالبة، 34 معلمة، 186 درساً، حضور 82%، تحسن +38%، رضا 4.7/5')">نسخ ملخص التقرير</button></div>
 <div class="grid g2"><div class="card"><h3>متوسط الدرجات قبلي ← بعدي</h3><div class="chartbars" style="height:200px">${[['A0',32,71],['A1',45,74],['A2',52,78],['B1',58,80]].map(l=>`<div class="b"><div style="display:flex;gap:4px;align-items:flex-end;width:100%;justify-content:center;height:100%"><i class="t" style="height:${l[1]*1.8}px;max-width:22px"></i><i style="height:${l[2]*1.8}px;max-width:22px"></i></div><span>${l[0]}</span></div>`).join('')}</div><div class="row small"><span><i style="display:inline-block;width:10px;height:10px;background:var(--pink);border-radius:3px"></i> قبلي</span><span><i style="display:inline-block;width:10px;height:10px;background:var(--maroon);border-radius:3px"></i> بعدي</span></div></div>
 <div class="card"><h3>نتائج استبيانات الرضا</h3>${[['الشعور بالأمان والخصوصية',96],['جودة المعلمات',94],['مناسبة المحتوى لحياتي',89],['سهولة استخدام المنصة',87],['جودة الاتصال',71]].map(x=>`<div style="margin:8px 0"><div class="row between small"><span>${x[0]}</span><b>${x[1]}%</b></div>${bar(x[1])}</div>`).join('')}</div></div>
 <div class="card" style="margin-top:16px"><h3>مؤشرات التمكين (استبيان 3 أشهر)</h3><div class="grid g4">${kpi('71%','زادت ثقتهن بأنفسهن')}${kpi('23%','تقدمن لعمل أو دراسة')}${kpi('48%','يساعدن أطفالهن في واجبات الإنجليزية')}${kpi('12','دراسة حالة موثقة')}</div></div>`},
partners(){return `<div class="main-head"><h2>الشركاء والرعاة</h2><button class="btn btn-p btn-sm" onclick="toast('نموذج إضافة شريك')">+ شريك</button></div><div class="card tbl"><table><tr><th>الشريك</th><th>النوع</th><th>المقاعد المرعية</th><th>الكود</th><th>الحالة</th></tr>${[['شريك (أ) — منظمة تنموية','داعم مالي',150,'PARTNER-A','نشط'],['جمعية نسائية محلية (ب)','شريك مجتمعي — إحالة طالبات','—','INVITE-B','نشط'],['جامعة (ج)','شريك أكاديمي — تدريب المعلمات','—','—','قيد التوقيع'],['شركة تقنية (د)','دعم تقني وباقات بيانات',50,'PARTNER-D','مفاوضات']].map(p=>`<tr><td><b>${p[0]}</b></td><td class="small">${p[1]}</td><td>${p[2]}</td><td class="en small">${p[3]}</td><td><span class="chip ${p[4]==='نشط'?'ok':'warn'}">${p[4]}</span></td></tr>`).join('')}</table></div>`},

 <div class="card"><h3>إعدادات تعليمية</h3><label class="f"><span>الحد الأقصى لطالبات الفصل</span><input class="inp" type="number" value="12"></label><label class="f"><span>مدة الاحتفاظ بالتسجيلات (ساعة)</span><input class="inp" type="number" value="48"></label><label class="f"><span>نسبة الحضور المطلوبة للشهادة</span><input class="inp" value="80%"></label><label class="f"><span>لغة الواجهة</span><select class="inp"><option>العربية</option><option>English</option></select></label><button class="btn btn-p" onclick="toast('تم الحفظ')">حفظ</button></div></div>`}

V.partner={
dash(){return `<div class="main-head"><div><h2>لوحة الأثر</h2><p class="muted" style="margin:0">بيانات مجمعة ومجهولة الهوية — لا تُعرض أي بيانات شخصية للطالبات.</p></div><span class="chip pink">تحديث شهري</span></div>
 <div class="grid g3">${[['الطالبات المسجلات',312,500],['المعلمات المؤهلات',34,50],['الشهادات الصادرة',118,400]].map(x=>`<div class="card"><div class="kpi"><div class="l">${x[0]}</div><div class="v">${x[1]} <span class="small muted">/ ${x[2]}</span></div></div>${bar(x[1]/x[2]*100)}<span class="small muted">${Math.round(x[1]/x[2]*100)}% من هدف السنة الأولى</span></div>`).join('')}</div>
 <div class="grid g4" style="margin-top:16px">${kpi('+38%','تحسن متوسط في الاختبارات')}${kpi('96%','يشعرن بالأمان')}${kpi('19','محافظة يمنية')}${kpi('2,140','ساعة تعليم مباشر')}</div>
 <div class="grid g2" style="margin-top:16px"><div class="card"><h3>من قصص الطالبات (دراسة حالة — بموافقة وباسم مستعار)</h3><p class="muted">"م" من حضرموت، أم لثلاثة أطفال، بدأت من المستوى التمهيدي. بعد 4 أشهر أصبحت تساعد أطفالها في واجبات الإنجليزية، وتقدمت لوظيفة إدخال بيانات تتطلب إنجليزية أساسية.</p></div>
 <div class="card"><h3>خطة الاستثمار والاستدامة</h3><div class="list-item">1️⃣ <span><b>الآن:</b> مجاني بالكامل + كود HIND100 لبناء الثقة والقاعدة</span></div><div class="list-item">2️⃣ <span><b>بعد 6-9 أشهر:</b> خطط مدفوعة رمزية + منح للمحتاجات</span></div><div class="list-item">3️⃣ <span><b>التوسع:</b> خدمات مؤسسية، مسارات مهنية، ومستويات متقدمة</span></div><button class="btn btn-p btn-sm" style="margin-top:10px" onclick="go('sponsor')">ارعَ مقاعد دراسية</button></div></div>`},
sponsor(){const n=S.sponsor.seats,cost=n*15;return `<div class="main-head"><h2>رعاية المقاعد الدراسية</h2></div><div class="grid g2"><div class="card"><h3>احسب أثر دعمك</h3><label class="f"><span>عدد المقاعد (طالبة لفصل دراسي كامل — 3 أشهر)</span><input type="range" min="5" max="200" step="5" value="${n}" style="width:100%;accent-color:var(--maroon)" oninput="S.sponsor.seats=+this.value;render()"></label>
 <div style="font-size:40px;font-weight:700;color:var(--maroon)">${n} طالبة</div><div class="sep"></div><div class="row between"><span>التكلفة التقديرية</span><b style="font-size:22px">${cost.toLocaleString('en')}$</b></div><p class="small muted">≈ 15$ للطالبة/الفصل: حصة المعلمة، المنصة، الإشراف، وباقة بيانات.</p>
 <button class="btn btn-p" onclick="modal('<h3>شكراً لاهتمامكم 🤍</h3><p class=muted>هذا نموذج عرض: في النسخة الفعلية يُنشأ كود رعاية خاص بكم (مثل PARTNER-X) ويتواصل معكم فريق الشراكات لتوقيع الاتفاقية واستلام التقارير.</p><button class=\\'btn btn-p\\' onclick=closeModal()>حسناً</button>')">طلب رعاية ${n} مقعد</button></div>
 <div class="card"><h3>ماذا يحصل الشريك؟</h3><div class="list-item">🏷️ كود خاص لتتبع المقاعد المرعية</div><div class="list-item">📈 لوحة أثر مباشرة وتقارير ربع سنوية</div><div class="list-item">📖 دراسات حالة موثقة (بموافقة الطالبات)</div><div class="list-item">🤝 ظهور الشعار في صفحة الشركاء وفق دليل الهوية</div></div></div>`},
preports(){return `<div class="main-head"><h2>التقارير الدورية</h2></div><div class="card">${[['تقرير الربع الثالث 2026','أكتوبر 2026'],['تقرير الإطلاق — الشهر الأول','يوليو 2026'],['تقرير الأثر نصف السنوي','قريباً']].map(r=>`<div class="list-item"><span style="font-size:22px">📄</span><div style="flex:1"><b>${r[0]}</b><div class="small muted">${r[1]}</div></div>${r[1]==='قريباً'?'<span class="chip">قريباً</span>':`<button class="btn btn-g btn-sm" onclick="toast('في النسخة الفعلية: تنزيل PDF')">عرض</button>`}</div>`).join('')}</div>`}
};

/* ============ SCENARIOS ============ */
let GUIDE=null;
function openScenarios(){modal(`<h2>🧭 سيناريوهات العرض</h2><p class="muted small">اختاري سيناريو لتنتقلي للدور المناسب، وستظهر لك الخطوات في بطاقة جانبية.</p>${SCENARIOS.map((s,i)=>`<div class="scn-card"><div class="row between"><b>${i+1}. ${s.t}</b><span class="chip">${s.who}</span></div><div class="small muted" style="margin:6px 0">${s.steps.length} خطوات</div><button class="btn btn-p btn-sm" onclick="startScenario(${i})">ابدئي السيناريو</button></div>`).join('')}`)}
function startScenario(i){closeModal();GUIDE={i,done:[]};SCENARIOS[i].go();drawGuide()}
function drawGuide(){const g=$('#guide');if(!GUIDE){g.classList.remove('on');return}const s=SCENARIOS[GUIDE.i];g.innerHTML=`<div class="hd"><b class="small">🧭 ${s.t}</b><button onclick="GUIDE=null;drawGuide()">✕</button></div><ol>${s.steps.map((t,j)=>`<li class="${GUIDE.done.includes(j)?'done':''}" onclick="const d=GUIDE.done;d.includes(${j})?d.splice(d.indexOf(${j}),1):d.push(${j});drawGuide()">${t}</li>`).join('')}</ol><div style="padding:0 14px 12px" class="row between"><span class="small muted">اضغطي الخطوة لتعليمها ✓</span><button class="btn btn-g btn-sm" onclick="openScenarios()">سيناريو آخر</button></div>`;g.classList.add('on')}

render();
</script>
</body>
</html>
